<main class="page">
    <!--HEADINGS-->
    <div class="heading">
        <h1 [attr.aria-busy]="loadingUsername()">
            @if (loadingUsername()) {
            <app-skeleton class="greeting-skeleton" width="12rem" height="2.5rem" />
            } @else if (usernameLoadError()) {
            Welcome
            } @else {
            Hi, {{username()}}
            }
        </h1>
        <p>Resume of your inventory today</p>
    </div>
    <!--KPIS-->
    <section class="kpis">
        @for (kpi of kpis; track kpi.label) {
        <app-kpi [topText]="kpi.label" [value]="kpi.value.toString()" [bottomText]="kpi.hint" [tone]="kpi.tone" />
        }
    </section>
    <!--FEATURES-->
    <section class="features">
        @for (feature of features; track feature.text) {
        <app-dashboard-feature [card]="feature" />
        }
    </section>

</main>
