<main class="page">
    <!--HEADINGS-->
    <div class="heading">
        <h1>Scan Products</h1>
        <p>Pair your phone, scan the products and store them.</p>
    </div>
    @if(!barcodeReceived()) {
    <!--QR AND PRODUCTS RECEIVED -->
    <section class="stage">
        <article class="card">
            @if (qrGenerated()) {
            <!--QR ALREADY GENERATED-->
            <app-qr-code [qrUrl]="qrUrl()" />
            } @else {
            <!--DIALOG TO CREATE A SESSION-->
            <app-sync-phone-dialog [sessionError]="sessionError()" [loadingQr]="loadingQr()"
                (createSession)="onCreateSession()" />
            }
        </article>
    </section>
    } @else {
    <section class="stage">
        <section class="stage">
            <app-product-form [barcode]="barcode()" [operation]="formOperation()" [product]="product()"
                [categories]="categories()" [loading]="loadingProduct()" [submitting]="submitting()"
                [lookupFailed]="lookupFailed()" [formError]="formError()" [fieldErrors]="fieldErrors()"
                (submitted)="onProductFormSubmit($event)" (retry)="setFormMode(barcode())" />
        </section>
    </section>
    }

</main>
