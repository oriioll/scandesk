<figure class="qr">
    <div class="tile">
        <img [src]="qrUrl()" alt="Link to sync device page" width="240" height="240">
    </div>
    <figcaption>
        <p class="status">Scan the QR code and start scanning!</p>
        <small class="muted">Waiting for products to be scanned...</small>
    </figcaption>
</figure>
