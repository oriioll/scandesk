<main class="page">
    <!--HEADINGS-->
    <div class="heading">
        <h1>Connect your phone</h1>
        <p>Use this device as a barcode scanner for your ScanDesk session.</p>
    </div>
    <div class="camera">
        <div class="stage" [attr.aria-busy]="loading()">
            @if (loading()) {
            <app-skeleton class="stage-skeleton" height="auto" />
            } @else if (token_error()) {
            <div class="stage-box" role="alert">
                <p class="error">No token available, scan your QR code again</p>
            </div>
            } @else if (session_error()) {
            <div class="stage-box" role="alert">
                <p class="error">That session doesn't exist or it expired</p>
            </div>
            } @else {
            <app-barcode-scanner (scanned)="onBarcodeScanned($event)" />
            }
        </div>
    </div>
</main>
