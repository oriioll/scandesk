<div class="intro">
  <svg
    class="icon"
    viewBox="0 0 24 24"
    width="40"
    height="40"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="7" y="2" width="10" height="20" rx="2" />
    <path d="M11 18h2" />
  </svg>
  <p>Link your phone to use it as a barcode scanner.</p>
  <button
    class="cta"
    [disabled]="loadingQr()"
    [attr.aria-busy]="loadingQr()"
    (click)="createSession.emit()"
  >
    @if (loadingQr()) {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-label="Loading">
        <path
          fill="currentColor"
          opacity=".35"
          d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8A8 8 0 0 1 12 20Z"
        />
        <path fill="currentColor" d="M20 12h2A10 10 0 0 0 12 2V4A8 8 0 0 1 20 12Z">
          <animateTransform
            attributeName="transform"
            dur="1s"
            from="0 12 12"
            to="360 12 12"
            repeatCount="indefinite"
            type="rotate"
          />
        </path>
      </svg>
    } @else {
      Pair phone!
    }
  </button>
</div>
