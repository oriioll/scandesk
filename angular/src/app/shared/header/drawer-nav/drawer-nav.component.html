<div class="drawer">
    <div class="drawer-head">
        <app-header-logo />
        <button type="button" class="close" aria-label="Close menu" (click)="closeRequested.emit()">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path fill="currentColor"
                    d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z" />
            </svg>
        </button>
    </div>

    <div class="card">
        <span class="avatar">{{ userAcronym() }}</span>
        <div class="user-info">
            <strong>{{ username() }}</strong>
            <span>{{ email() }}</span>
        </div>
    </div>

    <nav class="drawer-links" aria-label="Main">
        <a class="drawer-link" routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="closeRequested.emit()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z" />
            </svg>
            Dashboard
        </a>
        <a class="drawer-link" routerLink="/products" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="closeRequested.emit()">
            <span class="icon i-products" aria-hidden="true"></span>
            Products
        </a>
        <a class="drawer-link" routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page"
            (click)="closeRequested.emit()">
            <span class="icon i-history" aria-hidden="true"></span>
            History
        </a>
    </nav>

    <hr class="sep" />

    <div class="drawer-actions">
        <button type="button" class="secondary" routerLink="/scan" (click)="closeRequested.emit()">Scan</button>
        <button type="button" routerLink="/checkout" (click)="closeRequested.emit()">Checkout</button>
    </div>

    <div class="spacer"></div>

    <div class="theme-options" role="group" aria-label="Theme">
        @for (opt of themeOptions; track opt.value) {
        <button type="button" class="theme-option" [class.active]="themeService.mode() === opt.value"
            [attr.aria-pressed]="themeService.mode() === opt.value" (click)="themeService.set(opt.value)">
            {{ opt.label }}
        </button>
        }
    </div>

    <button type="button" class="logout" (click)="onLogout()">
        <span class="error item-content">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m16 17l5-5l-5-5m5 5H9m0 9H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            </svg>
            Log out
        </span>
    </button>
</div>
