<header>
    <nav class="left">
        <svg (click)="onBurgerClick()" class="burger" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25"
            height="25">
            <path fill="none" stroke="var(--text)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 6h18M3 12h18M3 18h18" />
        </svg>
        <app-header-logo class="headerLogo" />
        <div class="links">
            <a class="navItem" routerLink="/dashboard" routerLinkActive="active"
                ariaCurrentWhenActive="page">Dashboard</a>
            <a class="navItem" routerLink="/products" routerLinkActive="active"
                ariaCurrentWhenActive="page">Products</a>
            <a class="navItem" routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">History</a>
        </div>

    </nav>
    <div class="right">
        <button class="secondary" routerLink="/scan">Scan</button>
        <button class="primary" routerLink="/checkout">Checkout</button>
        <div class="verticalSeparator"></div>
        <app-theme-toggle />
        <button type="button" class="user" aria-label="User Menu" [attr.aria-busy]="loadingUser()"
            [cdkMenuTriggerFor]="menu"
            [cdkMenuPosition]="menuPosition">
            @if (loadingUser()) {
            <app-skeleton width="2.5rem" height="2.5rem" radius="50%" />
            } @else {
            {{ profileLoadError() ? '?' : userAcronym }}
            }
        </button>

        <ng-template #menu>
            <div class="menu" cdkMenu>
                <div class="menu-user" [attr.aria-busy]="loadingUser()">
                    @if (loadingUser()) {
                    <app-skeleton width="8rem" height="1rem" />
                    <app-skeleton width="11rem" height=".875rem" />
                    } @else if (profileLoadError()) {
                    <span role="alert">Couldn't load profile details.</span>
                    } @else {
                    <strong>{{ username() }}</strong>
                    <span>{{ email() }}</span>
                    }
                </div>

                <hr class="menu-sep" />

                <div class="menu-label">Theme</div>
                <div class="theme-options">
                    @for (opt of themeOptions; track opt.value) {
                    <button type="button" cdkMenuItem class="theme-option"
                        [class.active]="themeService.mode() === opt.value" (click)="themeService.set(opt.value)">
                        {{ opt.label }}
                    </button>
                    }
                </div>
                <hr class="menu-sep" />
                <button type="button" cdkMenuItem class="menu-item" (click)="onLogout()">
                    <span class="error item-content">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="m16 17l5-5l-5-5m5 5H9m0 9H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        </svg>
                        Log out
                    </span>
                </button>
            </div>
        </ng-template>
    </div>
</header>
